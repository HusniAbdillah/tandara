name: tandara-demo
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }
x-server: &server
  NODE_ENV: production
  APP_MODE: simulation
  DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
  DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD for shared demo accounts}
  DATABASE_URL: postgres://tandara:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tandara
  REDIS_URL: redis://unused:6379
  API_HOST: 0.0.0.0
  API_PORT: '3000'
  SESSION_SECURE: 'true'
  TRUST_PROXY: 'true'
  WEB_ORIGINS: ${WEB_ORIGINS:?Set the exact frontend origins}
  WORKER_ENABLED: 'true'
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
  AI_MODE: ${AI_MODE:-heuristic}
  AI_PROVIDER: ${AI_PROVIDER:-vikey}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
  AI_EMBEDDING_MODE: ${AI_EMBEDDING_MODE:-disabled}
  AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-gemini}
  AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-gemini-embedding-001}
  AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
  AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
  AI_INPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_INPUT_MICRO_USD_PER_MILLION_TOKENS:-1000000}
  AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS:-3000000}
  AI_EMBEDDING_MICRO_USD_PER_MILLION_TOKENS: ${AI_EMBEDDING_MICRO_USD_PER_MILLION_TOKENS:-10000000}
  AI_DAILY_BUDGET_MICRO_USD: ${AI_DAILY_BUDGET_MICRO_USD:-0}
  AI_ORG_DAILY_BUDGET_MICRO_USD: ${AI_ORG_DAILY_BUDGET_MICRO_USD:-0}
  AI_MONTHLY_BUDGET_MICRO_USD: ${AI_MONTHLY_BUDGET_MICRO_USD:-0}
  AI_RUN_MAX_MICRO_USD: ${AI_RUN_MAX_MICRO_USD:-1500000}
  AI_MAX_PENDING_PER_REGION: ${AI_MAX_PENDING_PER_REGION:-100}
  AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-1}
  AI_DATA_PROCESSING_APPROVED: ${AI_DATA_PROCESSING_APPROVED:-false}
  ALLOW_LIVE_SOURCES: ${ALLOW_LIVE_SOURCES:-false}
  OBSERVATIONS_MODE: ${OBSERVATIONS_MODE:-live}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-tandara}
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to the release image with PostGIS and pgvector}
    environment:
      POSTGRES_USER: tandara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tandara
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    mem_limit: 640m
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30, -c, work_mem=4MB]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  migrate:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image}
    environment: *server
    command: [node, api/node_modules/@tandara/backend/database-command.mjs, migrate]
    profiles: [operations]
    networks: [database]
    mem_limit: 256m
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
  seed:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image}
    environment:
      <<: *server
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a unique demo password}
    command: [node, api/node_modules/@tandara/backend/database-command.mjs, seed]
    profiles: [operations]
    networks: [database]
    mem_limit: 256m
    depends_on: { postgres: { condition: service_healthy } }
    logging: *logging
  api:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image}
    environment: *server
    networks: [database, application]
    mem_limit: 512m
    init: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging
  worker:
    image: ${APP_IMAGE:?Set APP_IMAGE to the release image}
    environment: *server
    command: [node, worker/dist/main.js]
    networks: [database, application]
    mem_limit: 256m
    init: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, worker/node_modules/@tandara/backend/worker-health.mjs]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [application]
    mem_limit: 96m
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
    logging: *logging
networks:
  database: { internal: true }
  application: {}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
