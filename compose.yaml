name: tandara
services:
  postgres:
    image: tandara-postgres:local
    build: { context: ., dockerfile: infrastructure/postgres/Dockerfile }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tandara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set local database password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tandara}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    image: tandara-app:local
    build: { context: ., target: app }
    environment: &server-env
      NODE_ENV: production
      APP_MODE: simulation
      DATABASE_URL: postgres://${POSTGRES_USER:-tandara}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tandara}
      REDIS_URL: redis://unused:6379
      API_HOST: 0.0.0.0
      API_PORT: 3000
      TRUST_PROXY: 'true'
      LOG_LEVEL: info
      WORKER_ENABLED: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      AI_MODE: ${AI_MODE:-heuristic}
      AI_PROVIDER: ${AI_PROVIDER:-custom}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      AI_EMBEDDING_MODE: ${AI_EMBEDDING_MODE:-disabled}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-vikey}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI_INPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_INPUT_MICRO_USD_PER_MILLION_TOKENS:-1000000}
      AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS:-3000000}
      AI_EMBEDDING_MICRO_USD_PER_MILLION_TOKENS: ${AI_EMBEDDING_MICRO_USD_PER_MILLION_TOKENS:-10000000}
      AI_DAILY_BUDGET_MICRO_USD: ${AI_DAILY_BUDGET_MICRO_USD:-5000000}
      AI_MONTHLY_BUDGET_MICRO_USD: ${AI_MONTHLY_BUDGET_MICRO_USD:-100000000}
      AI_ORG_DAILY_BUDGET_MICRO_USD: ${AI_ORG_DAILY_BUDGET_MICRO_USD:-1000000}
      AI_RUN_MAX_MICRO_USD: ${AI_RUN_MAX_MICRO_USD:-1500000}
      AI_MAX_PENDING_PER_REGION: ${AI_MAX_PENDING_PER_REGION:-100}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-4}
      AI_DATA_PROCESSING_APPROVED: ${AI_DATA_PROCESSING_APPROVED:-false}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      ALLOW_LIVE_SOURCES: ${ALLOW_LIVE_SOURCES:-false}
      OBSERVATIONS_MODE: ${OBSERVATIONS_MODE:-live}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080,http://localhost:8081,http://127.0.0.1:8080,http://127.0.0.1:8081}
    command:
      [sh, -c, 'node packages/database/dist/migrate.js && node packages/database/dist/seed.js']
    depends_on: { postgres: { condition: service_healthy } }
  api:
    image: tandara-app:local
    environment: *server-env
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    image: tandara-app:local
    environment: *server-env
    command: [node, apps/worker/dist/main.js]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: [CMD, node, tooling/worker-health.mjs]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    image: tandara-web:local
    build: { context: ., target: web }
    volumes:
      - type: bind
        source: ./apps/coordinator-web/public/basemap.json
        target: /srv/posko/basemap.json
        read_only: true
    ports: ['127.0.0.1:8080:8080', '127.0.0.1:8081:8081']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
