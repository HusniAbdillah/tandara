name: CI

on:
  push:
    branches: [main, bulk/everything]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'Run the full Docker/browser suite (offline, auth, maps and product flows)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: simulation
      DEMO_PASSWORD: ci-only-synthetic-password
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL with PostGIS and pgvector
        run: |
          docker build -t tandara-postgres:local -f infrastructure/postgres/Dockerfile .
          docker run -d --name tandara-ci-db -p 127.0.0.1:55432:5432 -e POSTGRES_USER=tandara -e POSTGRES_PASSWORD=ci_only_password -e POSTGRES_DB=tandara --health-cmd 'pg_isready -U tandara -d tandara' --health-interval 5s --health-retries 20 tandara-postgres:local
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' tandara-ci-db)" = healthy ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and enforce architecture boundaries
        run: pnpm lint
      - name: Test deployment routing and packaging
        run: pnpm test:deployment
      - name: Test portable image verification
        run: python3 -m unittest discover -s tooling/deployment -p '*_test.py'
      - name: Validate deployment shell scripts
        run: |
          for script in infrastructure/deployment/*.sh tooling/deployment/*.sh; do
            bash -n "$script"
            shellcheck "$script"
          done
      - name: Typecheck all workspaces and tooling
        run: pnpm typecheck
      - name: Run unit and HTTP tests
        run: pnpm test
      - name: Build all application packages
        run: pnpm build
      - name: Verify portable production dependencies
        run: |
          pnpm --filter @tandara/api deploy --prod "$RUNNER_TEMP/tandara-runtime/api"
          pnpm --filter @tandara/worker deploy --prod "$RUNNER_TEMP/tandara-runtime/worker"
          node --input-type=module -e 'await import(process.argv[1]); await import(process.argv[2])' \
            "$RUNNER_TEMP/tandara-runtime/api/node_modules/@tandara/backend/dist/index.js" \
            "$RUNNER_TEMP/tandara-runtime/worker/node_modules/@tandara/backend/dist/index.js"
      - name: Test AI evaluation and privacy tooling
        run: pnpm test:tooling
      - name: Verify migrations are repeatable
        run: pnpm db:migrate && pnpm db:migrate
        env:
          DATABASE_URL: postgres://tandara:ci_only_password@127.0.0.1:55432/tandara
      - name: Verify demo seed is repeatable
        run: pnpm db:seed && pnpm db:seed
        env:
          DATABASE_URL: postgres://tandara:ci_only_password@127.0.0.1:55432/tandara
      - name: Test real PostGIS and API product contracts
        run: node --env-file=.env --test --test-concurrency=1 tests/integration/*.test.mjs
        env:
          DATABASE_URL: postgres://tandara:ci_only_password@127.0.0.1:55432/tandara
          PG_DRILL_CONTAINER: tandara-ci-db
      - name: Verify OpenAPI matches the implementation
        run: pnpm api:openapi && git diff --exit-code -- docs/api/openapi.json
      - name: Install Chromium for UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify Warga flows and Posko observation integration
        run: pnpm test:e2e:warga
      - name: Upload Chalk browser failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chalk-browser-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            playwright-report/warga/
            test-results/
      - name: Build and start full browser stack
        id: browser_stack
        if: github.event_name == 'workflow_dispatch' && inputs.full_e2e
        run: docker compose up --build -d --wait
      - name: Test full browser product flows
        if: github.event_name == 'workflow_dispatch' && inputs.full_e2e
        run: pnpm test:e2e
      - name: Upload full browser evidence
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_e2e
        with:
          name: browser-evidence
          retention-days: 3
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            docs/qa/screenshots/
      - name: Stop full browser stack
        if: always() && (steps.browser_stack.outcome == 'success' || steps.browser_stack.outcome == 'failure')
        run: docker compose down --volumes --remove-orphans
      - name: Summarize CI coverage
        if: always()
        env:
          FULL_E2E: ${{ github.event_name == 'workflow_dispatch' && inputs.full_e2e }}
          CHECK_STATUS: ${{ job.status }}
        run: |
          printf 'CI status: %s\n\n' "$CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Routine gate: formatting, lint/boundaries, typecheck, unit/HTTP tests, all builds, real PostGIS/API integration, repeatable migrations/seed, OpenAPI, deployment validation and Chalk desktop/mobile browser checks.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Full Docker/browser E2E requested: %s. Enable full_e2e on a manual CI run before the jury rehearsal.\n' "$FULL_E2E" >> "$GITHUB_STEP_SUMMARY"
